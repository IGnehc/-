<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗夜村庄 · 狼人杀</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#f3f4f6;font:16px system-ui,Arial}main{max-width:940px;margin:auto;padding:24px}h1{color:#fbbf24}section{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:20px;margin:15px 0}input,button,textarea{font:inherit;padding:11px;border-radius:8px;border:1px solid #4b5563}input,textarea{background:#111827;color:white}button{background:#d97706;color:white;cursor:pointer;margin:4px}button:hover{background:#b45309}.secondary{background:#374151}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.player{background:#111827;padding:14px;border-radius:10px}.dead{opacity:.45}.me{outline:2px solid #fbbf24}#log{height:310px;overflow:auto;white-space:pre-wrap;line-height:1.8}small{color:#9ca3af}.hidden{display:none}#actions button{min-width:95px}textarea{width:100%;min-height:75px}</style></head><body><main><h1>🌙 暗夜村庄 · 狼人杀</h1><p>6人局 · 真人与基础AI混合 · 服务器裁判</p><section id="entrance"><input id="name" placeholder="你的昵称" maxlength="20"><p><button onclick="create()">创建房间</button> <input id="code" placeholder="6位房间码" maxlength="6" style="width:140px"><button class="secondary" onclick="join()">加入房间</button></p><small>单人游玩：创建房间后直接开始，空位由AI补齐。多人游玩：将房间码分享给朋友。</small></section><section id="game" class="hidden"><h2 id="status"></h2><p id="identity"></p><div id="players" class="players"></div><div id="start"></div></section><section id="actionPanel" class="hidden"><h3 id="prompt"></h3><div id="actions"></div></section><section id="history" class="hidden"><h3>公开游戏记录</h3><div id="log"></div></section></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();let state;const $=id=>document.getElementById(id);const nick=()=>$('name').value.trim()||'真人玩家';function create(){socket.emit('create',{name:nick()},r=>{if(!r.ok)alert(r.error)})}function join(){socket.emit('join',{name:nick(),code:$('code').value.trim()},r=>{if(!r.ok)alert(r.error)})}socket.on('private',t=>alert(t));socket.on('state',s=>{state=s;$('entrance').classList.add('hidden');$('game').classList.remove('hidden');$('history').classList.remove('hidden');$('status').textContent=`房间 ${s.code} · 第${s.day}天 · ${({lobby:'等待开始',night_wolf:'狼人行动',night_seer:'预言家查验',night_witch:'女巫行动',speech:'轮流发言',pk_speech:'平票PK发言',vote:'投票',ended:'游戏结束'})[s.phase]}`;$('identity').textContent=s.phase==='lobby'?'等待房主开始':`你是 ${s.me}号 · 身份：${s.role||'未分配'}${s.role==='狼人'&&s.wolfTeammates?.length?' · 🐺 狼人队友：'+s.wolfTeammates.map(x=>x.id+'号 '+x.name+(x.alive?'':'（已出局）')).join('、'):''}${s.winner?' · 胜利方：'+s.winner:''}`;$('players').innerHTML=s.players.map(p=>`<div class="player ${p.alive?'':'dead'} ${p.id===s.me?'me':''}"><b>${p.id}号 ${escapeHTML(p.name)}</b><p>${p.ai?'🤖 AI':'👤 真人'} · ${p.alive?'存活':'出局'}</p><small>${p.role||(s.role==='狼人'&&s.wolfTeammates?.some(x=>x.id===p.id)?'🐺 狼人队友':'')}</small></div>`).join('');$('start').innerHTML=s.phase==='ended'?'<button onclick="location.reload()">创建新对局</button>':s.phase==='lobby'?(s.host?'<button onclick="socket.emit(\'start\')">开始游戏（AI自动补位）</button>':'等待房主开始') :'';$('log').textContent=s.log.join('\n');if(s.phase!=='ended'&&s.players.find(p=>p.id===s.me&&!p.alive))$('identity').textContent+=' · 已出局，正在观战（AI继续自动行动）';$('log').scrollTop=$('log').scrollHeight;let active=s.turn===s.me&&s.options.length&&s.phase!=='ended';$('actionPanel').classList.toggle('hidden',!active);if(!active)return;const labels={night_wolf:'请选择击杀目标',night_seer:'请选择查验目标',night_witch:'请选择使用药剂或跳过',speech:'轮到你发言',pk_speech:'平票PK，请发言',vote:'请选择放逐目标'};$('prompt').textContent=labels[s.phase];if(s.phase==='speech'||s.phase==='pk_speech'){$('actions').innerHTML='<textarea id="speechText" maxlength="350" placeholder="输入你的推理与发言"></textarea><button onclick="sendSpeech()">发送发言</button>'}else $('actions').innerHTML=s.options.map(v=>{let id=typeof v==='object'?v.id:v;let name=typeof v==='object'?v.name:v==='skip'?'弃票 / 跳过':v+'号';return `<button onclick="sendAction('${id}')">${name}</button>`}).join('')});function sendAction(value){socket.emit('action',{value})}function sendSpeech(){socket.emit('action',{text:$('speechText').value})}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
